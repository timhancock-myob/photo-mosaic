[project]
name = "photo-mosaic"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["mosaic-core", "source-gateway", "mosaic-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mosaic-core = { workspace = true }
source-gateway = { workspace = true }
mosaic-api = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mosaic_core", "source_gateway", "mosaic_api"]

[tool.pytest.ini_options]
testpaths = ["packages/mosaic_core/tests", "packages/source_gateway/tests", "packages/mosaic_api/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mosaic_core.*"
strict = true
